<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --neon-blue: #00f3ff;
      --neon-pink: #ff0099;
      --dark-bg: #0a0a16;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--dark-bg);
      color: white;
      font-family: 'Segoe UI', sans-serif;
      overflow-x: hidden;
      perspective: 1000px;
    }

    .grid-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transform: rotateX(60deg);
      animation: gridFloat 20s linear infinite;
    }

    .grid {
      position: absolute;
      top: -150%;
      left: -50%;
      width: 200%;
      height: 300%;
      background-image: 
        linear-gradient(90deg, rgba(0, 243, 255, 0.3) 1px, transparent 1px),
        linear-gradient(rgba(0, 243, 255, 0.3) 1px, transparent 1px);
      background-size: 40px 40px;
      transform: translateZ(0);
    }

    @keyframes gridFloat {
      0% {
        transform: rotateX(60deg) translateY(0);
      }
      100% {
        transform: rotateX(60deg) translateY(40px);
      }
    }

    .content {
      position: relative;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      z-index: 1;
    }

    .hero {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: white;
      text-shadow: 
        0 0 10px var(--neon-blue),
        0 0 20px var(--neon-blue),
        0 0 30px var(--neon-blue);
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 
          0 0 10px var(--neon-blue),
          0 0 20px var(--neon-blue),
          0 0 30px var(--neon-blue);
      }
      to {
        text-shadow: 
          0 0 20px var(--neon-blue),
          0 0 30px var(--neon-blue),
          0 0 40px var(--neon-blue),
          0 0 50px var(--neon-blue);
      }
    }

    .subtitle {
      font-size: 1.5rem;
      margin-bottom: 2rem;
      color: var(--neon-pink);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .floating-elements {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .floating-element {
      position: absolute;
      width: 50px;
      height: 50px;
      border: 2px solid var(--neon-pink);
      opacity: 0.5;
      animation: float 10s linear infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.5;
      }
      50% {
        transform: translateY(-100px) rotate(180deg);
        opacity: 0.8;
      }
      100% {
        transform: translateY(-200px) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="grid-container">
    <div class="grid"></div>
  </div>
  
  <div class="floating-elements">
    <div class="floating-element" style="left: 20%; top: 30%"></div>
    <div class="floating-element" style="left: 80%; top: 60%"></div>
    <div class="floating-element" style="left: 40%; top: 80%"></div>
  </div>

  <div class="content">
    <div class="hero">
      <div>
        <h1>Smalls AI</h1>
        <p class="subtitle">Revolutionizing the Future of Intelligence</p>
      </div>
    </div>
  </div>
</body>
</html>
